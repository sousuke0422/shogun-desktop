# Monorepo: the app plus extraction-ready library crates. The terminal
# engine lives in crates/rikka-terminal (see its Cargo.toml for the layering
# rule); vendored gpui / alacritty_terminal stay outside the workspace and
# are wired in via [patch.crates-io] below.
[workspace]
members = [
    "crates/rikka-terminal",
    "crates/rikka-terminal-agent-integration",
    "crates/rikka-terminal-ssh-integration",
    "crates/shogun-core",
]
exclude = ["crates/alacritty_terminal", "crates/gpui"]

[package]
name = "shogun-desktop"
version = "0.4.0"
edition = "2024"

[dependencies]
gpui = "0.2.2"
gpui-component = "0.5.1"
alacritty_terminal = "0.24"
portable-pty = "0.9"
anyhow = "1"
# Already in-tree via gpui; used to race PTY wakeups against the SGR-blink
# phase timer in the terminal refresh tasks.
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_yml = "0.0.12"
toml = "1"
dirs = "6"
regex = "1"
russh = { version = "0.61", default-features = false, features = ["ring"] }
# russh-keys deferred to Phase 2 (pins home=0.5.5, conflicts with gpui ^0.5.9)
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "io-util", "time", "net", "macros", "process"] }
unicode-width = "0.2"
# Kitty graphics protocol (terminal/kitty_graphics.rs): PNG decode + base64
# payloads + optional zlib (o=z). All three already in-tree via gpui's deps.
image = "0.25"
base64 = "0.22"
flate2 = "1"
parking_lot = "0.12"
arboard = "3"
rfd = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Temporarily vendored from shogun-suite (crates/shogun-core) until that
# repo goes live on GitHub — then switch back to the cross-repo path dep.
shogun-core = { path = "crates/shogun-core" }
# Terminal engine (RikkaTerminal core) — extracted from src/terminal/.
rikka-terminal = { path = "crates/rikka-terminal" }
# Agent-activity heuristics (Claude spinner → progress; future Codex etc.),
# kept out of the agent-agnostic engine core.
rikka-terminal-agent-integration = { path = "crates/rikka-terminal-agent-integration" }
# Remote-shell TERM_PROGRAM injection over SSH (bashrc / ZDOTDIR wrappers),
# kept out of the SSH-agnostic engine core.
rikka-terminal-ssh-integration = { path = "crates/rikka-terminal-ssh-integration" }

[target.'cfg(windows)'.dependencies]
# OSC 9 / 777 desktop notifications → WinRT toast (MIT OR Apache-2.0).
tauri-winrt-notification = "0.7.3"

[target.'cfg(target_os = "macos")'.dependencies]
# OSC 9 / 777 desktop notifications → NSUserNotificationCenter (MIT/Apache-2.0).
# objc2-based thin wrapper; same family gpui's mac backend already links.
mac-notification-sys = "0.6.15"

[patch.crates-io]
alacritty_terminal = { path = "crates/alacritty_terminal" }
# Vendored for one fix: generate_font_fallbacks (DirectWrite) never searched
# the custom font collection, so embedded fallback fonts (bundled Twemoji)
# were silently skipped and emoji fell through to Segoe UI Emoji.
# See crates/gpui/src/platform/windows/direct_write.rs "PATCHED".
gpui = { path = "crates/gpui" }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
