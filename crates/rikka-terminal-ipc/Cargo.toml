[package]
name = "rikka-terminal-ipc"
version = "0.1.0"
edition = "2024"
publish = false
description = "Shared local-IPC wire contract for RikkaTerminal: message types + JSON + length-prefixed framing, used by rikka-terminal (monarch/window), rt (launcher), and rikka-handoff (Windows shim). Transport + handle transfer live in the consumers. See crates/rikka-terminal/IPC.md."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Tab-move `state` payload: replayable VT bytes ride the JSON frame as base64.
base64 = "0.22"
# Cross-platform local socket: Unix domain socket on Unix, named pipe on
# Windows, one API. Namespaced names → no manual path/cleanup.
interprocess = "2.4"
# "std" gives getrandom::Error its StdError impl — required for the
# io::Error conversion in security.rs on non-Windows targets.
getrandom = { version = "0.3", features = ["std"] }

# Windows: current-user-only DACL on the listener (security.rs). widestring
# matches interprocess's own version so the SDDL round-trips cleanly.
[target.'cfg(windows)'.dependencies]
widestring = "1"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }
