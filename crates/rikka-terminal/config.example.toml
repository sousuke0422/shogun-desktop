# RikkaTerminal config — copy to %APPDATA%\rikka-terminal\config.toml to use.
# Every field is optional; with no config the new-tab menu simply mirrors
# Windows Terminal's profiles and opens wt's default profile.

[profiles]
# Pull Windows Terminal's profiles into the new-tab (⌄) menu. Default: true.
use_windows_terminal = true

# Hide profiles you never launch here, by display name or guid. wt profiles
# already marked "hidden" are dropped automatically.
hidden = ["Azure Cloud Shell"]

# New-tab default, by name or guid. Omit to honor wt's own defaultProfile.
# default = "PowerShell"

# Your own profiles. They lead the menu, before the wt ones. command is argv
# (command[0] is the program); dir is an optional starting directory;
# theme is a per-profile color scheme (a wt scheme name, resolved like
# [theme] wt_scheme) so tabs from different profiles get different colors.
# Imported wt profiles carry their own colorScheme automatically.
# [[profiles.list]]
# name = "Dev PowerShell"
# command = ["pwsh.exe", "-NoLogo"]
# dir = "C:\\work"
# theme = "Ubuntu"

# [[profiles.list]]
# name = "Arch (WSL)"
# command = ["wsl.exe", "-d", "Arch"]

[appearance]
# Grid font (default: Consolas) and size in logical px (default: 13.0).
# font = "Cascadia Mono"
# font_size = 14.0
# Cell height = font_size × line_height (default: 1.2).
# line_height = 1.3
# OpenType features, ghostty's font-feature shape. The font's ligatures are
# ON by default (pick a ligature font like "Cascadia Code" — Consolas and
# Cascadia Mono have none); "-calt" turns them off, "ss19" etc. picks
# stylistic sets ("tag", "-tag", "tag=N").
# font_features = ["-calt"]
# Search-bar design: "winui" (default) or "vscode" (the original
# blue-accent flavor).
# search_style = "vscode"
# Blurred (acrylic) window background. Default: off.
# acrylic = true

[terminal]
# Scrollback history lines per tab (default: 10000).
# scrollback = 50000
# TERM for spawned shells (default: xterm-256color) — what konsole/alacritty
# set; cross-platform TUIs like btop read it for color/capability detection.
# term = "xterm-256color"
# XTVERSION + TERM_PROGRAM identity: "honest" (rikka-terminal; default) or
# "ghostty" (masquerade so emulator-sniffing apps enable kitty features).
# Keep honest over ConPTY — a spoof invites conhost-stripped protocols.
# identity = "honest"

[logging]
# Tera Term-style session logging, toggled per tab with Ctrl+Shift+L
# (● shows in the tab while recording). Raw PTY output is teed verbatim,
# so `type`/`cat` of the file replays colors and all.
# Save directory (default: ~/Documents/rikka-terminal-logs).
# directory = 'C:\logs'
# ALSO record sent keystrokes into *.input.log. Default: off — an input
# log captures typed passwords; opt in deliberately.
# log_input = true
# Start logging on every new tab automatically. Default: off.
# auto_start = true

[keys]
# Reassign the tab-management chords. Value shape: "mod+mod+key" with mods
# ctrl / shift / alt and gpui's lowercase key names (t, tab, f5, ...).
# Unset entries keep the built-in Ctrl+Shift chord. A typo keeps the
# default (and logs a warning) rather than unbinding the action.
# new_tab = "ctrl+shift+t"
# close_tab = "ctrl+shift+w"
# detach_tab = "ctrl+shift+d"
# eject_tab = "ctrl+shift+e"
# move_tab = "ctrl+shift+x"
# merge_all = "ctrl+shift+a"
# toggle_logging = "ctrl+shift+l"
# copy = "ctrl+shift+c"
# paste = "ctrl+shift+v"
# cycle_back = "ctrl+shift+tab"
# Jump between shell prompts (needs OSC 133 marks — see Shell integration).
# jump_prompt_prev = "ctrl+shift+up"
# jump_prompt_next = "ctrl+shift+down"
# Scrollback search. Literal by default; the .* button (Alt+R) switches to
# regex, Aa (Alt+C) forces case-sensitive (off = smart-case). Enter = next,
# Shift+Enter = prev, Esc closes.
# search = "ctrl+shift+f"

# ── Shell integration ────────────────────────────────────────────────────
# rikka reads two things your shell can emit (no config needed here):
#  * OSC 133 prompt marks — Ctrl+Shift+Up/Down then jumps between prompts.
#  * OSC 9;9 (Windows path) or OSC 7 (file:// URL) cwd reports — a new tab
#    then opens in the ACTIVE tab's directory instead of your home.
#
# PowerShell ($PROFILE) — prepend to what your prompt function returns:
#   "`e]133;A`a`e]9;9;`"$($PWD.Path)`"`a" + "PS $PWD> "
# bash (~/.bashrc):
#   PS1='\[\e]133;A\a\]'"$PS1"
#   PROMPT_COMMAND='printf "\e]7;file://%s\a" "$PWD"'

[theme]
# Terminal color palette. Import a Windows Terminal color scheme BY NAME
# (compat mode) — resolved from wt's settings.json AND the fragment dirs
# where vendors like Ubuntu drop schemes:
# wt_scheme = "Ubuntu"
# Inline overrides win over the imported scheme; each is "#RRGGBB":
# background = "#300A24"
# foreground = "#EEEEEC"
# selection = "#B5D5FF"
# The 16 ANSI colors (black..white, then brightBlack..brightWhite):
# ansi = [
#   "#2E3436", "#CC0000", "#4E9A06", "#C4A000",
#   "#3465A4", "#75507B", "#06989A", "#D3D7CF",
#   "#555753", "#EF2929", "#8AE234", "#FCE94F",
#   "#729FCF", "#AD7FA8", "#34E2E2", "#EEEEEC",
# ]
