[package]
name = "rikka-terminal-windows-integration"
version = "0.1.0"
edition = "2024"
publish = false
description = "RikkaTerminal's Windows OS-integration home. First tenant: the default-terminal handoff shim (rikka-handoff.exe) — registered as the terminal COM server (ITerminalHandoff3), receives the OS handoff, relays it to the running RikkaTerminal over the shared IPC. Kept out of rt so rt itself never links COM."

# The manifest (crates/rikka-terminal/packaging/AppxManifest.xml) references
# this as `rikka-handoff.exe`, so pin the binary name independent of the crate.
[[bin]]
name = "rikka-handoff"
path = "src/main.rs"

# Windows-only by nature: off-Windows the bin compiles to an inert stub with
# no dependencies at all.
[target.'cfg(windows)'.dependencies]
rikka-terminal-ipc = { path = "../rikka-terminal-ipc" }
anyhow = "1"
# Direct dep required: the #[interface]/#[implement] expansions reference the
# literal crate path `windows_core::…`.
windows-core = "0.61"

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
    # (the #[interface]/#[implement] macros and the *_Impl traits ship
    # unconditionally in windows 0.61 — no feature gate)
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Pipes",
    "Win32_System_Threading",
]
