# shogun-desktop for the old multi-agent-shogun layout, kept as-is while the
# root app becomes honden-desktop. A copy of the root app, not a move: the
# root package keeps the `shogun-desktop` name, so this one is renamed to
# `shogun-desktop-legacy` (one workspace cannot hold two packages or two bins
# of the same name).
#
# [patch.crates-io] and the workspace live in the root Cargo.toml and apply
# here too. The bundled fonts are read from the root's assets/ (see
# src/main.rs) instead of being copied; only the icon is kept locally.
[package]
name = "shogun-desktop-legacy"
version = "0.6.1"
edition = "2024"
publish = false
# fontprobe would collide with the root's bin of the same name in
# target/<profile>/, so both bins are named explicitly.
autobins = false

[[bin]]
name = "shogun-desktop-legacy"
path = "src/main.rs"

[[bin]]
name = "fontprobe-legacy"
path = "src/bin/fontprobe.rs"

[dependencies]
gpui = "0.2.2"
gpui-component = "0.5.1"
alacritty_terminal = "0.24"
portable-pty = "0.9"
# SSH password in the OS credential store instead of plaintext settings.toml:
# Credential Manager / Keychain / freedesktop Secret Service (KWallet serves
# that D-Bus API natively on Plasma 6.2+, so no Qt linkage here). `vendored`
# builds libdbus into the Linux binary so CI needs no -dev package.
keyring = { version = "3", features = [
    "windows-native",
    "apple-native",
    "sync-secret-service",
    "vendored",
] }
anyhow = "1"
# Already in-tree via gpui; used to race PTY wakeups against the SGR-blink
# phase timer in the terminal refresh tasks.
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_yml = "0.0.12"
toml = "1"
dirs = "6"
regex = "1"
russh = { version = "0.61", default-features = false, features = ["ring"] }
# russh-keys deferred to Phase 2 (pins home=0.5.5, conflicts with gpui ^0.5.9)
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "io-util", "time", "net", "macros", "process"] }
unicode-width = "0.2"
# Kitty graphics protocol (terminal/kitty_graphics.rs): PNG decode + base64
# payloads + optional zlib (o=z). All three already in-tree via gpui's deps.
image = "0.25"
base64 = "0.22"
flate2 = "1"
parking_lot = "0.12"
arboard = "3"
rfd = "0.15"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Temporarily vendored from shogun-suite (crates/shogun-core) until that
# repo goes live on GitHub — then switch back to the cross-repo path dep.
shogun-core = { path = "../shogun-core" }
# Terminal engine (RikkaTerminal core) — extracted from src/terminal/.
rikka-terminal-core = { path = "../rikka-terminal-core" }
# Agent-activity heuristics (Claude spinner → progress; future Codex etc.),
# kept out of the agent-agnostic engine core.
rikka-terminal-agent-integration = { path = "../rikka-terminal-agent-integration" }
# Remote-shell TERM_PROGRAM injection over SSH (bashrc / ZDOTDIR wrappers),
# kept out of the SSH-agnostic engine core.
rikka-terminal-ssh-integration = { path = "../rikka-terminal-ssh-integration" }
# TSF IME integration so the Windows taskbar input indicator tracks our
# windows (no-op off-Windows). App-driven from window focus events.
rikka-terminal-gpui-ime = { path = "../rikka-terminal-gpui-ime" }

[target.'cfg(windows)'.dependencies]
# OSC 9 / 777 desktop notifications → WinRT toast (MIT OR Apache-2.0).
tauri-winrt-notification = "0.7.3"

# Taskbar-button progress (ITaskbarList3) — see src/taskbar_progress.rs.
[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(target_os = "macos")'.dependencies]
# OSC 9 / 777 desktop notifications → NSUserNotificationCenter (MIT/Apache-2.0).
# objc2-based thin wrapper; same family gpui's mac backend already links.
mac-notification-sys = "0.6.15"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"
