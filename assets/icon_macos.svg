<svg xmlns="http://www.w3.org/2000/svg" width="108" height="108" viewBox="0 0 108 108">
  <!-- macOS app icon: dark rounded-square plate (platform convention) with the
       kabuto glyph inset ~10%. The bare-glyph icon.svg is kept for Windows. -->
  <rect x="4" y="4" width="100" height="100" rx="23" fill="#141414"/>
  <rect x="4" y="4" width="100" height="100" rx="23" fill="none" stroke="#2a2a2a" stroke-width="1"/>
  <!-- Kabuto (samurai helmet) silhouette derived from multi-agent-shogun by yohey-w (MIT) -->
  <g transform="translate(10.8,10.8) scale(0.8)">
    <!-- Crescent moon ornament (maedate) — horns pointing up, Date style -->
    <path fill="#C9A94E" d="M28,22 Q54,50 80,22 Q54,36 28,22 Z"/>
    <!-- Helmet dome (hachi) -->
    <path fill="#C9A94E" d="M34,46 Q54,30 74,46 L74,62 L34,62 Z"/>
    <!-- Neck guard tier 1 (shikoro) -->
    <path fill="#C9A94E" d="M30,62 L78,62 L82,68 L26,68 Z"/>
    <!-- Neck guard tier 2 -->
    <path fill="#C9A94E" d="M26,68 L82,68 L86,74 L22,74 Z"/>
    <!-- Neck guard tier 3 -->
    <path fill="#C9A94E" d="M22,74 L86,74 L90,82 L18,82 Z"/>
  </g>
</svg>
